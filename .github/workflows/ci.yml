name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  edge-functions:
    name: Edge Functions and OpenAPI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      - name: Check formatting
        run: deno fmt --check supabase/functions scripts deno.json

      - name: Type-check Edge Functions
        run: >-
          deno check
          supabase/functions/agent-storefront/index.ts
          supabase/functions/agent-webhook-dispatcher/index.ts
          scripts/sign-request.ts

      - name: Run unit tests
        run: deno test supabase/functions/_shared/shared_test.ts

      - name: Validate OpenAPI 3.1
        run: npx --yes @redocly/cli@2.1.3 lint supabase/functions/agent-storefront/openapi.json

  database:
    name: Migration and pgTAP
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.101.0

      - name: Start local Supabase
        run: supabase start

      - name: Reapply migrations from a clean database
        run: supabase db reset

      - name: Run database tests
        run: supabase test db --local

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
